; =============================================================================
; MoodleKit — Optimized PHP-FPM Pool Configuration
; Multi-Tenant Sizing & Overload Prevention
; =============================================================================
[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 2048

; Dynamic Process Management (Configured via Tenant Sizing Profiles)
pm = ${FPM_PM:-dynamic}
pm.max_children = ${FPM_MAX_CHILDREN:-50}
pm.start_servers = ${FPM_START_SERVERS:-5}
pm.min_spare_servers = ${FPM_MIN_SPARE_SERVERS:-4}
pm.max_spare_servers = ${FPM_MAX_SPARE_SERVERS:-10}
pm.process_idle_timeout = ${FPM_PROCESS_IDLE_TIMEOUT:-10s}
pm.max_requests = ${FPM_MAX_REQUESTS:-1000}

; Timeouts & Overload Protection
request_terminate_timeout = 180s
request_slowlog_timeout = 10s
slowlog = /var/log/php/slow.log
rlimit_files = 65535
rlimit_core = 0

; Logging & Environment
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; PHP INI overrides
php_admin_value[error_log] = /var/log/php/fpm-error.log
php_admin_flag[log_errors] = on
php_value[max_execution_time] = 180
php_value[memory_limit] = ${PHP_MEMORY_LIMIT:-512M}
