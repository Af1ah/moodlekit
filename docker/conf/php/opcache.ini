[opcache]
; =============================================================================
; MoodleKit — OPcache Production Tuning for Moodle 4.x / 5.x
; =============================================================================
opcache.enable = 1
opcache.enable_cli = 1

; Memory & String Caching (Moodle has >15,000 files)
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10

; Validation & Timestamps (Permits web plugin install/updates)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.revalidate_path = 0

; Code Integrity & Comments (Moodle requires comments preserved)
opcache.save_comments = 1
opcache.enable_file_override = 0

; JIT Compilation for PHP 8.x
opcache.jit = tracing
opcache.jit_buffer_size = 64M
