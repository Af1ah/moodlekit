# =============================================================================
# MoodleKit — Optimized Redis Configuration for Caching & Sessions
# =============================================================================

# Network
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management & LRU Eviction
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence (AOF + RDB snapshots)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000

# General
databases 16
always-show-logo no
loglevel notice
